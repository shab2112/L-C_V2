    <style>
      body {
        margin: 0;
        font-family: 'Manrope', Arial, sans-serif;
        background-color: #F5F0E6;
      }
      
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Chat Message HTML Styling */
      .chat-message {
        font-size: 0.95rem;
      }
      .chat-message p {
        margin-bottom: 0.75em;
      }
      .chat-message p:last-child {
        margin-bottom: 0;
      }
      .chat-message strong {
        font-weight: 700;
        color: inherit;
      }
      .chat-message ul {
        list-style-type: disc;
        padding-left: 1.25em;
        margin-bottom: 1em;
      }
      .chat-message ol {
        list-style-type: decimal;
        padding-left: 1.25em;
        margin-bottom: 1em;
      }
      .chat-message li {
        margin-bottom: 0.25em;
        padding-left: 0.25em;
      }
      .chat-message h3 {
        font-weight: 700;
        font-size: 1.1em;
        margin-top: 1.25em;
        margin-bottom: 0.5em;
        color: #0a192f;
      }
      /* User message overrides */
      .bg-lc-gold .chat-message h3 {
        color: white;
      }
      
      /* Chat Table Styling */
      .comparison-table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 11px;
        background: white;
      }
      .comparison-table th {
        background-color: #f3f4f6;
        padding: 8px;
        border: 1px solid #e5e7eb;
        font-weight: 600;
        text-align: left;
      }
      .comparison-table td {
        padding: 8px;
        border: 1px solid #e5e7eb;
      }
      .comparison-table tr:hover {
        background-color: #f9fafb;
      }
